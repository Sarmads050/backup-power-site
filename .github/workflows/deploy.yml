# Har baar jab "main" branch par koi change aata hai, yeh workflow website
# ko build karke GitHub Pages par daal deta hai (2-3 minute lagte hain).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Preview address. When the real domain is live, change SITE_URL to it,
      # set BASE_PATH to "/" and PUBLIC_PREVIEW to "false".
      SITE_URL: https://sarmads050.github.io
      BASE_PATH: /backup-power-site
      PUBLIC_PREVIEW: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
